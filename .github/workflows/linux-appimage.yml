name: Build Linux AppImage

# Builds self-contained AppImages of OnionHop V3 on Linux (the desktop app can't be packaged for
# Linux from the Windows dev box): x86_64, and aarch64 for 64-bit ARM desktops and laptops (#95).
# x86_64 uses the Tor Project's expert bundle; aarch64 cross-compiles Tor and its transports from
# source in download-deps.sh, like the ARM CLI. Each AppImage is then started on a runner of its own
# architecture. Run it manually and optionally attach the result to an existing release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the AppImages to (e.g. v3.0.0-pre.3). Leave blank to only produce build artifacts."
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: write

jobs:
  appimage:
    name: AppImage ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deps-arch: x64
            rid: linux-x64
          - arch: aarch64
            deps-arch: arm64
            rid: linux-arm64
            cross: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install AppImage tooling
        run: |
          sudo apt-get update
          # zsync provides zsyncmake, which writes the .zsync file AppImageUpdate uses.
          sudo apt-get install -y wget unzip zsync

      - name: Install the cross compiler
        if: matrix.cross
        run: sudo apt-get install -y --no-install-recommends ${{ matrix.cross }}

      - name: Build Linux native dependencies (tor, PTs, dnstt-client, sing-box, xray, ArtiHop)
        run: bash download-deps.sh ${{ matrix.deps-arch }}

      - name: Test
        if: matrix.arch == 'x86_64'
        run: dotnet test OnionHop/OnionHopV3.sln -c Release

      - name: Publish app (${{ matrix.rid }}, self-contained)
        run: |
          dotnet publish OnionHop/src/OnionHopV3.App/OnionHopV3.App.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            /p:PublishSingleFile=false /p:PublishReadyToRun=false \
            -o publish

      - name: Strip Windows-only artifacts from publish
        run: |
          find publish -type f -name '*.exe' -delete || true
          find publish -type f -name 'wintun.dll' -delete || true
          # Make bundled native helpers executable.
          chmod +x publish/OnionHopV3 || true
          for d in publish/tor publish/tor/pluggable_transports publish/vpn publish/snowflake publish/artihop; do
            [ -d "$d" ] && chmod +x "$d"/* 2>/dev/null || true
          done

      - name: Assemble AppDir
        run: |
          APPDIR=OnionHop.AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r publish/* "$APPDIR/usr/bin/"

          # Icon
          cp OnionHop/src/OnionHopV3.App/Assets/logo.png "$APPDIR/OnionHop.png"
          cp OnionHop/src/OnionHopV3.App/Assets/logo.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/OnionHop.png"
          cp OnionHop/src/OnionHopV3.App/Assets/logo.png "$APPDIR/.DirIcon"

          # Desktop entry
          cat > "$APPDIR/OnionHop.desktop" <<'DESK'
          [Desktop Entry]
          Type=Application
          Name=OnionHop
          Comment=Tor client with bridges, pluggable transports, and VPN/TUN routing
          Exec=OnionHopV3
          Icon=OnionHop
          Categories=Network;Security;
          Terminal=false
          DESK

          # AppRun launcher
          cat > "$APPDIR/AppRun" <<'RUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          cd "${HERE}/usr/bin"
          exec "${HERE}/usr/bin/OnionHopV3" "$@"
          RUN
          chmod +x "$APPDIR/AppRun"

          # The AppImage runs as whoever starts it, so everything in it has to be readable by every
          # user, and executable by every user where the owner can execute it. appimagetool refuses to
          # build otherwise (the published .NET assemblies come out as 0744).
          chmod -R a+rX "$APPDIR"

      # The maintained appimagetool (AppImage/appimagetool) embeds the static type 2 runtime, so the
      # AppImage no longer needs libfuse2 on the user's system; the old AppImageKit build did. The
      # tool itself runs here on x86_64; for aarch64 it is handed the aarch64 runtime, which is all
      # that differs, since the rest of an AppImage is the AppDir as a squashfs image. The update
      # information lets AppImageUpdate and similar tools fetch only the changed blocks from the latest
      # release, using the .zsync file published next to each AppImage.
      - name: Build AppImage
        run: |
          NAME="OnionHop-${{ matrix.arch }}.AppImage"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          RUNTIME_ARGS=()
          if [ "${{ matrix.arch }}" != "x86_64" ]; then
            wget -q "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${{ matrix.arch }}" -O runtime
            RUNTIME_ARGS=(--runtime-file runtime)
          fi
          UPDATE_INFO="gh-releases-zsync|${GITHUB_REPOSITORY_OWNER}|${GITHUB_REPOSITORY#*/}|latest|${NAME}.zsync"
          ARCH=${{ matrix.arch }} APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "${RUNTIME_ARGS[@]}" -u "$UPDATE_INFO" OnionHop.AppDir "$NAME"
          # appimagetool writes the .zsync itself when zsyncmake is installed; make sure it exists.
          if [ ! -f "$NAME.zsync" ]; then
            zsyncmake -u "$NAME" -o "$NAME.zsync" "$NAME"
          fi
          sha256sum "$NAME" | tee "$NAME.sha256.txt"
          file "$NAME"
          ls -lh "$NAME" "$NAME.zsync"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnionHop-${{ matrix.arch }}.AppImage
          path: |
            OnionHop-${{ matrix.arch }}.AppImage
            OnionHop-${{ matrix.arch }}.AppImage.sha256.txt
            OnionHop-${{ matrix.arch }}.AppImage.zsync
          if-no-files-found: error

      - name: Attach to release
        if: ${{ github.event_name == 'release' || inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}"
          NAME="OnionHop-${{ matrix.arch }}.AppImage"
          echo "Attaching $NAME to release $TAG"
          gh release upload "$TAG" "$NAME" "$NAME.sha256.txt" "$NAME.zsync" --repo "${{ github.repository }}" --clobber

  # Starts each AppImage on a runner of its architecture, the aarch64 one on GitHub's ARM64 runner
  # rather than under emulation. Does not hold back the release upload above.
  start-test:
    name: Start test ${{ matrix.arch }}
    needs: appimage
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the AppImage
        uses: actions/download-artifact@v4
        with:
          name: OnionHop-${{ matrix.arch }}.AppImage

      - name: Install a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11-utils imagemagick \
            libfontconfig1 libice6 libsm6 libx11-6 fonts-dejavu-core

      - name: Start OnionHop
        run: bash .github/scripts/linux-appimage-start-test.sh "OnionHop-${{ matrix.arch }}.AppImage" "onionhop-${{ matrix.arch }}.png"

      - name: Upload the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onionhop-${{ matrix.arch }}-screenshot
          path: onionhop-${{ matrix.arch }}.png
          if-no-files-found: ignore
